name: CI OpenCode Harness v7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript types & Run Unit Tests
        run: npm run validate

      - name: Smoke Test CLI (init, spec, gate, doctor)
        run: |
          node ./bin/opencode-harness.js --version
          node ./bin/opencode-harness.js doctor
